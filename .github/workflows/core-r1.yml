name: Workstation Core R1 CI

on:
  push:
    branches:
      - architecture/workstation-core-r1
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Check shell script syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          for source in scripts/*.sh; do
            bash -n "$source"
          done
      - name: Check bridge JavaScript syntax
        run: |
          for source in bridge/Superior-MI-Workstation-Bridge/web/js/*.js; do
            name="$(basename "$source" .js)"
            cp "$source" "/tmp/$name.mjs"
            node --check "/tmp/$name.mjs"
          done
      - name: Test graph control JavaScript
        run: |
          node tests/js/test_graph_controls.mjs /tmp/smi-graph-controls.mjs
      - name: Validate JSON assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [path for path in Path(".").rglob("*.json") if ".git" not in path.parts]
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"validated_json={len(paths)}")
          PY
      - name: Run tests
        run: python -m pytest -q
